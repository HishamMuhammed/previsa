# nginx config for the Previsa static site.
#
# The only thing this needs to do is serve files with correct MIME types and
# sensible caching. There is no backend, no proxy_pass and no dynamic anything —
# the whole application runs in the visitor's browser, which is why it can be
# deployed as a folder of files.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed asset filenames (index-CEBEXZEj.js), so their contents
    # change only when the name changes. Cache them hard. index.html is
    # deliberately NOT cached, or a deploy would never reach a returning visitor.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # pdf.js must load its worker as a MODULE. If nginx serves it as
    # application/octet-stream the browser refuses to execute it, and pdf.js fails
    # with an error that looks like a corrupt PDF rather than a MIME problem.
    #
    # The worker's real path is /assets/pdf.worker-<hash>.mjs — Vite rewrites
    # `new URL('../vendor/pdf.worker.mjs', import.meta.url)` into the hashed
    # assets path at build time. A first version of this block matched
    # /pdf.worker.mjs, a path that does not exist in the build output, so the MIME
    # was never actually corrected. Matching .mjs by extension is the fix: it is
    # correct wherever Vite happens to emit the file.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}